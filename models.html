<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frankenrun model viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0c0d1c; color: #fff; font: 13px system-ui, sans-serif; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      #panel { position: fixed; top: 8px; left: 8px; display: grid; grid-template-columns: auto auto; gap: 4px 8px; padding: 8px 10px; background: rgba(0,0,0,.55); border-radius: 6px; align-items: center; }
      #panel select, #panel input { font: inherit; }
      #info { position: fixed; bottom: 8px; left: 8px; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="panel">
      <label for="body">Body</label><select id="body"></select>
      <label for="legs">Legs</label><select id="legs"></select>
      <label for="arms">Arms</label><select id="arms"></select>
      <label for="head">Head</label><select id="head"></select>
      <label for="speed">Speed (m/s)</label><input id="speed" type="range" min="0" max="24" step="0.5" value="0" />
      <label for="az">Turn</label><input id="az" type="range" min="-180" max="180" step="1" value="35" />
      <label for="el">Tilt</label><input id="el" type="range" min="0" max="80" step="1" value="12" />
    </div>
    <div id="info"></div>
    <script type="module" src="/src/modelViewer.ts"></script>
  </body>
</html>
